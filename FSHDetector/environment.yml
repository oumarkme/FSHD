# Conda environment for FSHDetector — the engine that runs every process.
# Nextflow builds this automatically on the first run (no manual
# `conda env create` needed) and caches it for later runs.
name: fshdetector
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - bioconda::samtools=1.23
  - bioconda::minimap2=2.30
  - bioconda::blast=2.17.0
  - bioconda::ont-modkit=0.6.1
  - bioconda::pysam=0.23.3
  - conda-forge::pandas=3.0.1
