[build-system]
requires = ["setuptools>=77", "Cython>=3.0", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fshdetector"
dynamic = ["version"]
description = "D4Z4 repeat counting, haplotyping, and methylation from ONT long reads"
readme = "README.md"
license = "MIT"
authors = [{ name = "Jen-Hsiang Ou" }]
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pysam>=0.23"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
fshdetector = "fshdetector.cli:main"

[project.urls]
Repository = "https://github.com/oumarkme/FSHD"

[tool.setuptools.dynamic]
version = { attr = "fshdetector.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fshdetector = ["data/*", "*.pyx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyink]
line-length = 80
pyink-indentation = 4
pyink-use-majority-quotes = true
target-version = ["py311", "py312", "py313"]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
